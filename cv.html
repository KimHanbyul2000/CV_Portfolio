<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kim Hanbyul — CV</title>
<meta name="robots" content="noindex">
<!-- 인쇄용 이력서. data/profile.json 을 읽어 그린다. ?lang=en 이면 영어.
     PDF 는 src/cv_pdf.py 가 이 페이지를 인쇄해 assets/cv/ 에 만든다. 화면에서 직접 인쇄해도 같은 모양이다. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#141824;--muted:#5d6475;--line:#e1e4ec;--accent:#e0306f;--l1:#1a9e92;--l2:#2f6fe0;--l3:#8a55e6;--paper:#ffffff;--desk:#eef0f5}
@page{size:A4;margin:14mm 15mm}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:"Noto Sans KR",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:10pt;line-height:1.55;word-break:keep-all;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{position:sticky;top:0;display:flex;justify-content:flex-end;gap:8px;padding:10px 16px;background:var(--desk)}
.bar button,.bar a{appearance:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;
  padding:5px 14px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
.sheet{width:210mm;max-width:100%;min-height:297mm;margin:0 auto 32px;background:var(--paper);padding:14mm 15mm;
  box-shadow:0 2px 18px rgba(20,24,36,.08)}
@media print{
  body{background:none}
  .bar{display:none}
  .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
}
header{border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:14px}
h1{font-size:22pt;line-height:1.15;margin:0;letter-spacing:-.01em}
h1 small{font-size:11pt;color:var(--muted);font-weight:500;margin-left:8px}
.headline{margin:6px 0 8px;font-size:10.5pt}
.contact{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:9pt;color:var(--muted)}
.contact a{color:inherit;text-decoration:none}
.contact b{color:var(--ink);font-weight:500}
section{margin:0 0 13px;break-inside:avoid}
h2{font-size:9pt;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 6px;padding-bottom:3px;border-bottom:1px solid var(--line)}
h2 span.sub{color:var(--muted);letter-spacing:.04em;margin-left:6px;text-transform:none;font-weight:500}
.row{display:grid;grid-template-columns:30mm 1fr;gap:0 12px;margin:0 0 7px}
.row .when{color:var(--muted);font-size:9pt;line-height:1.4;padding-top:2px;overflow-wrap:anywhere}
.row .t{font-weight:700}
.row .w{color:var(--muted);font-size:9pt}
.row p{margin:2px 0 0}
.box{border-left:3px solid var(--accent);background:#fbf4f7;padding:6px 10px;margin-top:6px;font-size:9pt;color:var(--muted)}
.box .t{color:var(--ink);font-weight:500;font-size:9.5pt}
.chips{display:flex;flex-wrap:wrap;gap:3px 5px;margin-top:3px}
.chip{font-size:8.5pt;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.proj a{color:var(--ink);font-weight:700;text-decoration:none}
footer{margin-top:16px;padding-top:6px;border-top:1px solid var(--line);font-size:8pt;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="bar">
  <a id="lang" href="#"></a>
  <button id="print" type="button"></button>
</div>
<main class="sheet" id="cv"></main>
<script type="module">
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// 언어: ?lang= 이 우선, 없으면 홈페이지와 같은 localStorage "lang", 기본 한국어
let L = new URLSearchParams(location.search).get("lang");
if (L !== "en" && L !== "ko") { try { L = localStorage.getItem("lang"); } catch (e) {} }
L = L === "en" ? "en" : "ko";
document.documentElement.lang = L;

const pf = await fetch("data/profile.json").then(r => r.json());
const T = (o, k) => o[`${k}_${L}`];
const K = (ko, en) => L === "ko" ? ko : en;
const c = pf.current, pj = c.project;
const color = { L1: "var(--l1)", L2: "var(--l2)", L3: "var(--l3)" };
// 학력·교육의 연도는 타임라인에서 같은 기둥(pillar)을 가진 항목의 연도를 쓴다
const yearOf = id => pf.timeline.find(t => t.pillar === id)?.when ?? "";
const military = pf.timeline.find(t => t.when.startsWith("2021"));
const site = pf.links.find(l => l.label === "Home")?.href ?? "";
const gh = pf.links.find(l => l.label === "GitHub")?.href ?? "";
const portfolio = site + "CV_Portfolio/";
const today = new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Seoul" });
const bare = u => u.replace(/^https?:\/\//, "").replace(/\/$/, "");

$("cv").innerHTML = `
  <header>
    <h1>${esc(pf.name[L])}<small>${esc(pf.name[L === "ko" ? "en" : "ko"])}</small></h1>
    <p class="headline">${esc(pf.headline[L])}</p>
    <div class="contact">
      <span><b>Email</b> <a href="mailto:${esc(pf.contact.email)}">${esc(pf.contact.email)}</a></span>
      <span><b>Web</b> <a href="${esc(site)}">${esc(bare(site))}</a></span>
      <span><b>Portfolio</b> <a href="${esc(portfolio)}">${esc(bare(portfolio))}</a></span>
      <span><b>GitHub</b> <a href="${esc(gh)}">${esc(bare(gh))}</a></span>
    </div>
  </header>

  <section>
    <h2>${K("현재", "Current position")}</h2>
    <div class="row">
      <div class="when">${esc(T(c, "period"))}</div>
      <div>
        <div class="t">${esc(c.org)} · ${esc(T(c, "role"))}</div>
        <p>${esc(T(c, "detail"))}</p>
        ${pj ? `<div class="box">
          <div>${K("국가 R&D 과제", "National R&D project")} · ${esc(T(pj, "role"))}</div>
          <div class="t">${esc(T(pj, "title"))}</div>
          <div>${esc(T(pj, "program"))} · ${esc(pj.number)}</div>
          <div>${K("과제책임자", "PI")}: ${esc(T(pj, "pi"))} · ${esc(T(pj, "period"))}</div>
        </div>` : ""}
      </div>
    </div>
  </section>

  <section>
    <h2>${K("학력 · 교육", "Education & training")}</h2>
    ${pf.pillars.map(p => `
    <div class="row">
      <div class="when">${esc(yearOf(p.id))}</div>
      <div>
        <div class="t"><span class="dot" style="background:${color[p.id]}"></span>${esc(T(p, "title"))}</div>
        <div class="w">${esc(T(p, "where"))}</div>
      </div>
    </div>`).join("")}
  </section>

  <section>
    <h2>${K("기술", "Skills")}</h2>
    ${pf.pillars.map(p => `
    <div class="row">
      <div class="when">${esc(T(p, "title").split(/\s[—(]/)[0])}</div>
      <div class="chips">${T(p, "skills").map(s => `<span class="chip">${esc(s)}</span>`).join("")}</div>
    </div>`).join("")}
  </section>

  <section class="proj">
    <h2>${K("프로젝트", "Projects")}</h2>
    ${pf.projects.map(p => `
    <div class="row">
      <div class="when">${esc(p.when ?? "")}</div>
      <div><a href="${esc(p.href)}">${esc(p.name)}</a><p>${esc(p[L])}</p></div>
    </div>`).join("")}
  </section>

  ${military ? `<section>
    <h2>${K("병역", "Military service")}</h2>
    <div class="row"><div class="when">${esc(military.when)}</div><div>${esc(military[L])}</div></div>
  </section>` : ""}

  <footer>
    <span>${K("작성일", "Updated")} ${today}</span>
    <span>${esc(bare(portfolio))}</span>
  </footer>`;

$("lang").textContent = L === "ko" ? "English" : "한국어";
$("lang").href = `?lang=${L === "ko" ? "en" : "ko"}`;
$("print").textContent = K("인쇄 · PDF로 저장", "Print · Save as PDF");
$("print").onclick = () => print();
document.title = K("김한별 — 이력서", "Kim Hanbyul — CV");
await document.fonts.ready;
document.body.dataset.ready = "1";   // src/cv_pdf.py 가 이 표시를 기다렸다가 인쇄한다
</script>
</body>
</html>
